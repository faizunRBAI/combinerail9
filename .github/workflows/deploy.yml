    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Check formatting
      run: cargo fmt --check
    - name: Run Clippy
      run: cargo clippy -- -D warnings
