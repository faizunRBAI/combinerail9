[package]
name = "combinerail9"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
env_logger = "0.10"
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
