---
- name: Configure combinerail9 EC2 instance
  hosts: app
  become: true
  gather_facts: true

  vars:
    app_name: combinerail9
    app_user: combinerail9
    app_dir: /opt/combinerail9
    app_port: 8080
    binary_src: "{{ playbook_dir }}/../artifact/combinerail9"

  tasks:
    # ── Wait for SSH ─────────────────────────────────────────────────────────
    - name: Wait for SSH to be available
      wait_for_connection:
        delay: 5
        timeout: 120

    # ── System packages ──────────────────────────────────────────────────────
    - name: Wait for apt lock to be released
      shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 3; done
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install nginx and curl
      apt:
        name:
          - nginx
          - curl
        state: present

    # ── App user and directory ───────────────────────────────────────────────
    - name: Create app system user
      user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_dir }}"
        create_home: true

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    # ── Deploy binary ────────────────────────────────────────────────────────
    - name: Copy release binary to server
      copy:
        src: "{{ binary_src }}"
        dest: "{{ app_dir }}/{{ app_name }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      notify: Restart app

    # ── Systemd service ──────────────────────────────────────────────────────
    - name: Deploy systemd service unit
      copy:
        dest: /etc/systemd/system/{{ app_name }}.service
        content: |
          [Unit]
          Description=combinerail9 Rust/Actix-Web service
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          ExecStart={{ app_dir }}/{{ app_name }}
          Environment=PORT={{ app_port }}
          Environment=RUST_LOG=info
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify: Restart app

    - name: Enable and start app service
      systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started
        daemon_reload: true

    # ── Nginx reverse proxy ──────────────────────────────────────────────────
    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Deploy nginx vhost config
      copy:
        dest: /etc/nginx/sites-available/{{ app_name }}
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              location / {
                  proxy_pass         http://127.0.0.1:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_read_timeout 30s;
              }
          }
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/{{ app_name }}
        dest: /etc/nginx/sites-enabled/{{ app_name }}
        state: link
      notify: Reload nginx

    - name: Ensure nginx is enabled and started
      systemd:
        name: nginx
        enabled: true
        state: started

    # ── Flush handlers before health check ───────────────────────────────────
    - name: Flush handlers
      meta: flush_handlers

    # ── Health check ─────────────────────────────────────────────────────────
    - name: Wait for app port to be listening
      wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        timeout: 60

    - name: Verify app responds on port 80
      uri:
        url: "http://127.0.0.1/health"
        return_content: false
        status_code: 200
      retries: 6
      delay: 5
      register: health_result
      until: health_result.status == 200

  handlers:
    - name: Restart app
      systemd:
        name: "{{ app_name }}"
        state: restarted
        daemon_reload: true

    - name: Reload nginx
      systemd:
        name: nginx
        state: reloaded
